# pyequa defaults



answer_template: |
  Knowing

  {localgivenvars}

  and using

  {solvers}

  it can be found

  {localrequestedvars}




# 
student_feedback: |
  
  (No feedback is available. Please consult your class teacher(s).)



# Output destination of the produced exercises
output_service: moodle_cloze


# In a folder, the standard filename for anexercise template
student_template_filename: exercise_model.md

# CSV as a standard format
dataframe_type: csv  #csv or xlsx
csv_separator: "," 
csv_decimal: "." 

author: author


several_solutions: " (more than one solution; choose one) "
global_tolerance: 0.001


moodle_import_folder: imports

variant_word: Variant
problem_word: Problem


# Layering: these defaults < project.yaml (project root) < exercise.yaml (exercise folder).
# Any key may be set in either file. Old config.yaml files still work (deprecated).
#
# clozecloud (project.yaml only; never commit the token itself):
# clozecloud:
#   url: https://clozecloud.example.org
#   user_tag: your_tag
#   token_env: CLOZECLOUD_TOKEN   # env var holding the API token
# Then call pe.push() after reviewing the exercises.


# Debug section

# output a knowledge graph
output_knowledge_graph: false

# developer messages
debug: false

